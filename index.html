<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/src/assets/images/favicons/favicon-16x16.png"
    />
    <meta name="msapplication-TileColor" content="#0E0E11" />
    <meta name="theme-color" content="#0E0E11" />

    <title>Hexapus UI Lab - Boilerplate</title>

    <!-- REMIXICONS -->

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
    />
  </head>

  <body>
    <header class="header" id="header">
      <nav class="nav_floating">
        <a href="#" class="logo">
          <img
            src="./src/assets/images/hexapus-logo-dark.jpg"
            alt="logo"
            srcset=""
          />
        </a>

        <div class="menu" id="nav-menu">
          <ul class="list">
            <li>
              <a href="#home" class="link"> Home</a>
            </li>
            <li>
              <a href="#about" class="link"> About Us</a>
            </li>
            <li>
              <a href="#menu" class="link"> Menu</a>
            </li>
            <li>
              <a href="#contact" class="link button"> Contact</a>
            </li>
          </ul>

          <!-- Close -->
          <button class="close" id="nav-close">
            <i class="ri-close-large-line"></i>
          </button>
        </div>

        <!-- Toggle -->
        <button type="button" class="toggle" id="nav-toggle">
          <i class="ri-menu-line"></i>
        </button>
      </nav>
    </header>

    <div class="container bg_light">
      <section class="section" id="home">
        <h1>Home</h1>
      </section>
      <section class="section" id="about">
        <h1>About</h1>
      </section>
      <section class="section" id="menu">
        <h1>Menu</h1>
      </section>
      <section class="section" id="contact">
        <h1>Contact</h1>
      </section>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
